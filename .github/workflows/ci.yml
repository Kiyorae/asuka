name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Asuka.slnx -p:Platform=x64

      - name: Reject browser-engine application code
        shell: pwsh
        run: |
          $matches = & rg -n --glob '*.cs' --glob '*.xaml' --glob '*.csproj' --glob '!**/obj/**' --glob '!**/bin/**' '(WebView2?|BlazorWebView|CefSharp|Electron)' src
          if ($LASTEXITCODE -eq 0) {
            $matches | Write-Error
            throw 'Browser-engine references are forbidden in application source.'
          }
          if ($LASTEXITCODE -ne 1) { throw 'Source audit failed.' }

      - name: Format
        run: dotnet format Asuka.slnx --verify-no-changes --no-restore

      - name: Build ARM64
        shell: pwsh
        run: |
          dotnet restore src/Asuka.App/Asuka.App.csproj -p:Platform=ARM64
          if ($LASTEXITCODE -ne 0) { throw 'ARM64 restore failed.' }
          dotnet build src/Asuka.App/Asuka.App.csproj --configuration Release --no-restore -p:Platform=ARM64 -nodeReuse:false
          if ($LASTEXITCODE -ne 0) { throw 'ARM64 build failed.' }
          dotnet restore Asuka.slnx -p:Platform=x64
          if ($LASTEXITCODE -ne 0) { throw 'x64 restore failed after ARM64 validation.' }

      - name: Build
        run: dotnet build Asuka.slnx --no-restore -p:Platform=x64

      - name: Test
        run: dotnet test tests/Asuka.Tests/Asuka.Tests.csproj --no-build --no-restore -p:Platform=x64

      - name: Build and verify Windows 11 unsigned development MSIX
        shell: pwsh
        run: |
          ./scripts/package.ps1 -Platform x64 -Configuration Release -PackageVersion 0.1.0.1 -UnsignedInstallable
          $package = Get-ChildItem -LiteralPath artifacts/msix/runs -File -Recurse -Filter '*.msix' |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if ($null -eq $package) { throw 'The MSIX packaging step produced no package.' }
          $sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $package.FullName).Hash
          ./scripts/install-unsigned.ps1 -Package $package.FullName -ExpectedSha256 $sha256 -VerifyOnly
